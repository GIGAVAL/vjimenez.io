    <line class="street-grid" x1="100" y1="200" x2="330" y2="200"/>
    <line class="street-grid" x1="100" y1="230" x2="330" y2="230"/>
    <line class="street-grid" x1="100" y1="260" x2="330" y2="260"/>
    <line class="street-grid" x1="100" y1="290" x2="330" y2="290"/>

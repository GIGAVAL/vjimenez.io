<svg xmlns="http://www.w3.org/2000/svg" viewBox="370 50 300 700" id="nyc-map">
  <defs>
    <pattern id="crosshatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="rgba(0,0,0,0.18)" stroke-width="0.5"/>
    </pattern>
    <pattern id="crosshatch-hover" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="rgba(192,57,43,0.25)" stroke-width="0.5"/>
    </pattern>
    <filter id="cube-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <style>
    .borough { fill: none; stroke: rgba(0,0,0,0.08); stroke-width: 0.5; }
    .street-major { fill: none; stroke: rgba(0,0,0,0.06); stroke-width: 0.4; }
    .street-grid { fill: none; stroke: rgba(0,0,0,0.04); stroke-width: 0.25; }
    .water { fill: none; stroke: rgba(0,0,0,0.06); stroke-width: 0.6; }
    .park { fill: none; stroke: rgba(0,0,0,0.07); stroke-width: 0.4; }
    .bridge { fill: none; stroke: rgba(0,0,0,0.10); stroke-width: 0.6; }
  </style>

  <!-- WATER BODIES -->
  <g id="water">
    <!-- Hudson River (west) -->
    <path class="water" d="M380,0 Q375,100 370,200 Q365,300 360,400 Q355,500 350,600 Q340,700 330,800 Q320,900 310,1000"/>
    <path class="water" d="M340,0 Q335,100 330,200 Q325,300 320,400 Q315,500 310,600 Q300,700 290,800 Q280,900 270,1000"/>
    <!-- East River -->
    <path class="water" d="M620,0 Q625,50 640,100 Q660,150 670,200 Q680,260 685,300 Q690,350 700,400 Q720,450 730,500 Q740,550 735,600 Q725,650 710,700 Q700,750 680,800 Q660,850 640,900 Q620,950 600,1000"/>
    <path class="water" d="M660,0 Q665,50 680,100 Q700,150 710,200 Q720,260 725,300 Q730,350 740,400 Q760,450 770,500 Q780,550 775,600 Q765,650 750,700 Q740,750 720,800 Q700,850 680,900 Q660,950 640,1000"/>
    <!-- Upper Bay -->
    <path class="water" d="M330,800 Q400,820 480,830 Q560,840 640,830 Q680,820 700,810"/>
    <!-- Harlem River -->
    <path class="water" d="M520,80 Q540,75 560,80 Q580,90 600,100 Q615,110 625,120"/>
    <!-- Newtown Creek -->
    <path class="water" d="M700,420 Q720,415 740,420 Q760,425 780,420"/>
    <!-- Gowanus -->
    <path class="water" d="M540,680 Q545,700 540,720"/>
  </g>


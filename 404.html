  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --text: #0a0a0a;
    --text-light: rgba(10,10,10,0.62);
    --text-faint: rgba(10,10,10,0.42);

    min-height: 100vh;
    display: flex;

  a { color: var(--ink); text-decoration: none; }

  .message {

    font-size: 1.35rem;
    font-weight: 700;
    line-height: 1.2;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 1.6rem;

  .detail {
    font-size: 1.6rem;
    font-weight: 400;
    line-height: 1.5;
    color: var(--text-light);
    max-width: 44rem;
    margin-bottom: 3.2rem;

  .links {

  .links a:hover { color: var(--text-light); }

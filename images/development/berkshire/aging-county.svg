<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1067" width="1600" height="1067" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"><rect x="0.0" y="0.0" width="1600.0" height="1067.0" fill="#ffffff"/><text x="70.0" y="110.0" font-size="24" font-weight="700" fill="#8a8a8a" text-anchor="start" letter-spacing="4">BERKSHIRE COUNTY, MA  /  POPULATION BY AGE, 2010 TO 2017</text><text x="66.0" y="250.0" font-size="120" font-weight="800" fill="#0b0b0b" text-anchor="start" letter-spacing="-4">An aging county</text><text x="70.0" y="312.0" font-size="28" font-weight="400" fill="#8a8a8a" text-anchor="start" letter-spacing="0">Residents 65 and over grew by 16%. The 35 to 44 group, the first-home buyers, fell by 19%.</text><line x1="800" y1="380" x2="800" y2="910" stroke="#0b0b0b" stroke-width="2"/><rect x="800.0" y="400.0" width="414.2" height="62.0" fill="#E8FF3A" stroke="#0b0b0b" stroke-width="2"/><text x="776.0" y="442.0" font-size="30" font-weight="700" fill="#0b0b0b" text-anchor="end" letter-spacing="0">65 and over</text><text x="1234.2" y="444.0" font-size="40" font-weight="800" fill="#0b0b0b" text-anchor="start" letter-spacing="0">+16%</text><text x="1364.2" y="442.0" font-size="22" font-weight="400" fill="#8a8a8a" text-anchor="start" letter-spacing="0">24,674 to 28,605</text><rect x="800.0" y="504.0" width="146.6" height="62.0" fill="#0b0b0b" stroke="#0b0b0b" stroke-width="2"/><text x="776.0" y="546.0" font-size="30" font-weight="700" fill="#0b0b0b" text-anchor="end" letter-spacing="0">18 to 24</text><text x="966.6" y="548.0" font-size="40" font-weight="800" fill="#0b0b0b" text-anchor="start" letter-spacing="0">+6%</text><text x="1096.6" y="546.0" font-size="22" font-weight="400" fill="#8a8a8a" text-anchor="start" letter-spacing="0">11,584 to 12,237</text><rect x="800.0" y="608.0" width="59.5" height="62.0" fill="#0b0b0b" stroke="#0b0b0b" stroke-width="2"/><text x="776.0" y="650.0" font-size="30" font-weight="700" fill="#0b0b0b" text-anchor="end" letter-spacing="0">25 to 34</text><text x="879.5" y="652.0" font-size="40" font-weight="800" fill="#0b0b0b" text-anchor="start" letter-spacing="0">+2%</text><text x="1009.5" y="650.0" font-size="22" font-weight="400" fill="#8a8a8a" text-anchor="start" letter-spacing="0">13,507 to 13,816</text><rect x="625.9" y="712.0" width="174.1" height="62.0" fill="#0b0b0b" stroke="#0b0b0b" stroke-width="2"/><text x="824.0" y="754.0" font-size="30" font-weight="700" fill="#0b0b0b" text-anchor="start" letter-spacing="0">45 to 64</text><text x="605.9" y="756.0" font-size="40" font-weight="800" fill="#0b0b0b" text-anchor="end" letter-spacing="0">−7%</text><text x="1000.0" y="754.0" font-size="22" font-weight="400" fill="#8a8a8a" text-anchor="start" letter-spacing="0">40,030 to 37,349</text><rect x="301.6" y="816.0" width="498.4" height="62.0" fill="#0b0b0b" stroke="#0b0b0b" stroke-width="2"/><text x="824.0" y="858.0" font-size="30" font-weight="700" fill="#0b0b0b" text-anchor="start" letter-spacing="0">35 to 44</text><text x="281.6" y="860.0" font-size="40" font-weight="800" fill="#0b0b0b" text-anchor="end" letter-spacing="0">−19%</text><text x="1000.0" y="858.0" font-size="22" font-weight="400" fill="#8a8a8a" text-anchor="start" letter-spacing="0">15,829 to 12,795</text><text x="70.0" y="985.0" font-size="20" font-weight="400" fill="#8a8a8a" text-anchor="start" letter-spacing="1">Redrawn 2026 from the tables in the 2018 study. Source data: US Census, American Community Survey</text></svg>
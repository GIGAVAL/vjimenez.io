<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1067" width="1600" height="1067" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"><rect x="0.0" y="0.0" width="1600.0" height="1067.0" fill="#ffffff"/><text x="70.0" y="110.0" font-size="24" font-weight="700" fill="#8a8a8a" text-anchor="start" letter-spacing="4">DESIGN REVIEW RUBRIC  /  TEST REVIEW: ACUTE MENTAL HEALTH HOUSING UNIT</text><text x="64.0" y="300.0" font-size="190" font-weight="800" fill="#0b0b0b" text-anchor="start" letter-spacing="-8">8/36</text><rect x="70.0" y="335.0" width="470.0" height="26.0" fill="#E8FF3A"/><text x="70.0" y="425.0" font-size="38" font-weight="700" fill="#0b0b0b" text-anchor="start" letter-spacing="0">Twelve principles,</text><text x="70.0" y="473.0" font-size="38" font-weight="700" fill="#0b0b0b" text-anchor="start" letter-spacing="0">each scored 0 to 3.</text><text x="70.0" y="560.0" font-size="26" font-weight="400" fill="#8a8a8a" text-anchor="start" letter-spacing="0">Every score cites one of</text><text x="70.0" y="596.0" font-size="26" font-weight="400" fill="#8a8a8a" text-anchor="start" letter-spacing="0">seven published frameworks:</text><text x="70.0" y="650.0" font-size="26" font-weight="700" fill="#0b0b0b" text-anchor="start" letter-spacing="0">SAMHSA  /  NIC  /  AAJ  /  Vera</text><text x="70.0" y="688.0" font-size="26" font-weight="700" fill="#0b0b0b" text-anchor="start" letter-spacing="0">ACA  /  WBDG  /  BJA</text><text x="70.0" y="800.0" font-size="34" font-weight="700" fill="#0b0b0b" text-anchor="start" letter-spacing="0">Six principles scored zero.</text><text x="70.0" y="844.0" font-size="34" font-weight="700" fill="#0b0b0b" text-anchor="start" letter-spacing="0">Those are the gaps to close.</text><text x="70.0" y="985.0" font-size="20" font-weight="400" fill="#8a8a8a" text-anchor="start" letter-spacing="1">Scores from the reference review in the project files, May 2026</text><text x="1258.0" y="183.0" font-size="22" font-weight="700" fill="#8a8a8a" text-anchor="middle" letter-spacing="0">0</text><text x="1354.0" y="183.0" font-size="22" font-weight="700" fill="#8a8a8a" text-anchor="middle" letter-spacing="0">1</text><text x="1450.0" y="183.0" font-size="22" font-weight="700" fill="#8a8a8a" text-anchor="middle" letter-spacing="0">2</text><text x="1546.0" y="183.0" font-size="22" font-weight="700" fill="#8a8a8a" text-anchor="middle" letter-spacing="0">3</text><text x="1186.0" y="241.0" font-size="24" font-weight="400" fill="#0b0b0b" text-anchor="end" letter-spacing="0">1. Safety, physical and psychological</text><rect x="1264.0" y="213.0" width="84.0" height="42.0" fill="#E8FF3A" stroke="#0b0b0b" stroke-width="2"/><rect x="1360.0" y="213.0" width="84.0" height="42.0" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/><rect x="1456.0" y="213.0" width="84.0" height="42.0" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/><text x="1186.0" y="303.0" font-size="24" font-weight="700" fill="#0b0b0b" text-anchor="end" letter-spacing="0">2. Normative materiality and finishes</text><rect x="1264.0" y="275.0" width="84.0" height="42.0" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/><rect x="1360.0" y="275.0" width="84.0" height="42.0" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/><rect x="1456.0" y="275.0" width="84.0" height="42.0" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/><rect x="1216.0" y="275.0" width="36.0" height="42.0" fill="#0b0b0b" stroke="#0b0b0b" stroke-width="2"/><text x="1186.0" y="365.0" font-size="24" font-weight="400" fill="#0b0b0b" text-anchor="end" letter-spacing="0">3. Sightlines and supervision model</text><rect x="1264.0" y="337.0" width="84.0" height="42.0" fill="#E8FF3A" stroke="#0b0b0b" stroke-width="2"/><rect x="1360.0" y="337.0" width="84.0" height="42.0" fill="#E8FF3A" stroke="#0b0b0b" stroke-width="2"/><rect x="1456.0" y="337.0" width="84.0" height="42.0" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/><text x="1186.0" y="427.0" font-size="24" font-weight="700" fill="#0b0b0b" text-anchor="end" letter-spacing="0">4. Daylight access and biophilia</text><rect x="1264.0" y="399.0" width="84.0" height="42.0" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/><rect x="1360.0" y="399.0" width="84.0" height="42.0" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/><rect x="1456.0" y="399.0" width="84.0" height="42.0" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/><rect x="1216.0" y="399.0" width="36.0" height="42.0" fill="#0b0b0b" stroke="#0b0b0b" stroke-width="2"/><text x="1186.0" y="489.0" font-size="24" font-weight="700" fill="#0b0b0b" text-anchor="end" letter-spacing="0">5. Acoustic environment</text><rect x="1264.0" y="461.0" width="84.0" height="42.0" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/><rect x="1360.0" y="461.0" width="84.0" height="42.0" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/><rect x="1456.0" y="461.0" width="84.0" height="42.0" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/><rect x="1216.0" y="461.0" width="36.0" height="42.0" fill="#0b0b0b" stroke="#0b0b0b" stroke-width="2"/><text x="1186.0" y="551.0" font-size="24" font-weight="400" fill="#0b0b0b" text-anchor="end" letter-spacing="0">6. De-escalation and sensory regulation</text><rect x="1264.0" y="523.0" width="84.0" height="42.0" fill="#E8FF3A" stroke="#0b0b0b" stroke-width="2"/><rect x="1360.0" y="523.0" width="84.0" height="42.0" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/><rect x="1456.0" y="523.0" width="84.0" height="42.0" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/><text x="1186.0" y="613.0" font-size="24" font-weight="700" fill="#0b0b0b" text-anchor="end" letter-spacing="0">7. Programming, education, vocational</text><rect x="1264.0" y="585.0" width="84.0" height="42.0" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/><rect x="1360.0" y="585.0" width="84.0" height="42.0" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/><rect x="1456.0" y="585.0" width="84.0" height="42.0" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/><rect x="1216.0" y="585.0" width="36.0" height="42.0" fill="#0b0b0b" stroke="#0b0b0b" stroke-width="2"/><text x="1186.0" y="675.0" font-size="24" font-weight="400" fill="#0b0b0b" text-anchor="end" letter-spacing="0">8. Family contact and visitation dignity</text><rect x="1264.0" y="647.0" width="84.0" height="42.0" fill="#E8FF3A" stroke="#0b0b0b" stroke-width="2"/><rect x="1360.0" y="647.0" width="84.0" height="42.0" fill="#E8FF3A" stroke="#0b0b0b" stroke-width="2"/><rect x="1456.0" y="647.0" width="84.0" height="42.0" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/><text x="1186.0" y="737.0" font-size="24" font-weight="400" fill="#0b0b0b" text-anchor="end" letter-spacing="0">9. Gender-responsive design</text><rect x="1264.0" y="709.0" width="84.0" height="42.0" fill="#E8FF3A" stroke="#0b0b0b" stroke-width="2"/><rect x="1360.0" y="709.0" width="84.0" height="42.0" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/><rect x="1456.0" y="709.0" width="84.0" height="42.0" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/><text x="1186.0" y="799.0" font-size="24" font-weight="700" fill="#0b0b0b" text-anchor="end" letter-spacing="0">10. Cultural, historical, demographic context</text><rect x="1264.0" y="771.0" width="84.0" height="42.0" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/><rect x="1360.0" y="771.0" width="84.0" height="42.0" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/><rect x="1456.0" y="771.0" width="84.0" height="42.0" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/><rect x="1216.0" y="771.0" width="36.0" height="42.0" fill="#0b0b0b" stroke="#0b0b0b" stroke-width="2"/><text x="1186.0" y="861.0" font-size="24" font-weight="700" fill="#0b0b0b" text-anchor="end" letter-spacing="0">11. Staff wellness and respite</text><rect x="1264.0" y="833.0" width="84.0" height="42.0" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/><rect x="1360.0" y="833.0" width="84.0" height="42.0" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/><rect x="1456.0" y="833.0" width="84.0" height="42.0" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/><rect x="1216.0" y="833.0" width="36.0" height="42.0" fill="#0b0b0b" stroke="#0b0b0b" stroke-width="2"/><text x="1186.0" y="923.0" font-size="24" font-weight="400" fill="#0b0b0b" text-anchor="end" letter-spacing="0">12. Wayfinding, predictability, autonomy</text><rect x="1264.0" y="895.0" width="84.0" height="42.0" fill="#E8FF3A" stroke="#0b0b0b" stroke-width="2"/><rect x="1360.0" y="895.0" width="84.0" height="42.0" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/><rect x="1456.0" y="895.0" width="84.0" height="42.0" fill="#ffffff" stroke="#0b0b0b" stroke-width="2"/></svg>
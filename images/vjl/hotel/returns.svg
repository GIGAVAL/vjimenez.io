<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1067" width="1600" height="1067" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"><rect x="0.0" y="0.0" width="1600.0" height="1067.0" fill="#ffffff"/><text x="70.0" y="110.0" font-size="24" font-weight="700" fill="#8a8a8a" text-anchor="start" letter-spacing="4">HOTEL+  /  EAST VILLAGE  /  INVESTMENT CASE, JULY 2020</text><text x="64.0" y="300.0" font-size="190" font-weight="800" fill="#0b0b0b" text-anchor="start" letter-spacing="-8">10.5%</text><rect x="70.0" y="335.0" width="470.0" height="26.0" fill="#E8FF3A"/><text x="70.0" y="425.0" font-size="38" font-weight="700" fill="#0b0b0b" text-anchor="start" letter-spacing="0">Levered IRR over a</text><text x="70.0" y="473.0" font-size="38" font-weight="700" fill="#0b0b0b" text-anchor="start" letter-spacing="0">ten-year hold</text><text x="70.0" y="560.0" font-size="30" font-weight="700" fill="#0b0b0b" text-anchor="start" letter-spacing="0">2.44x equity multiple</text><text x="70.0" y="602.0" font-size="30" font-weight="700" fill="#0b0b0b" text-anchor="start" letter-spacing="0">$96.9M total profit</text><text x="70.0" y="644.0" font-size="30" font-weight="700" fill="#0b0b0b" text-anchor="start" letter-spacing="0">Exit at a 5.25% cap rate</text><text x="70.0" y="730.0" font-size="26" font-weight="400" fill="#8a8a8a" text-anchor="start" letter-spacing="0">60 keys on six floors.</text><text x="70.0" y="766.0" font-size="26" font-weight="400" fill="#8a8a8a" text-anchor="start" letter-spacing="0">37,296 sf allowed as of right;</text><text x="70.0" y="802.0" font-size="26" font-weight="400" fill="#8a8a8a" text-anchor="start" letter-spacing="0">the existing building uses 67% of it.</text><text x="70.0" y="985.0" font-size="20" font-weight="400" fill="#8a8a8a" text-anchor="start" letter-spacing="1">Redrawn 2026 from the July 2020 proposal</text><text x="800.0" y="215.0" font-size="22" font-weight="700" fill="#8a8a8a" text-anchor="start" letter-spacing="3">QUEEN ROOM, NIGHTLY RATE</text><line x1="800.0" y1="250" x2="800.0" y2="820" stroke="#c9c9c9" stroke-width="1"/><text x="800.0" y="850.0" font-size="20" font-weight="400" fill="#8a8a8a" text-anchor="middle" letter-spacing="0">$0</text><line x1="960.0" y1="250" x2="960.0" y2="820" stroke="#c9c9c9" stroke-width="1"/><text x="960.0" y="850.0" font-size="20" font-weight="400" fill="#8a8a8a" text-anchor="middle" letter-spacing="0">$200</text><line x1="1120.0" y1="250" x2="1120.0" y2="820" stroke="#c9c9c9" stroke-width="1"/><text x="1120.0" y="850.0" font-size="20" font-weight="400" fill="#8a8a8a" text-anchor="middle" letter-spacing="0">$400</text><line x1="1280.0" y1="250" x2="1280.0" y2="820" stroke="#c9c9c9" stroke-width="1"/><text x="1280.0" y="850.0" font-size="20" font-weight="400" fill="#8a8a8a" text-anchor="middle" letter-spacing="0">$600</text><text x="800.0" y="279.0" font-size="24" font-weight="700" fill="#0b0b0b" text-anchor="start" letter-spacing="0">The Bowery Hotel</text><rect x="1116.0" y="293.0" width="184.0" height="34.0" fill="#0b0b0b" stroke="#0b0b0b" stroke-width="2"/><text x="1316.0" y="319.0" font-size="22" font-weight="400" fill="#8a8a8a" text-anchor="start" letter-spacing="0">$395 to $625</text><text x="800.0" y="371.0" font-size="24" font-weight="700" fill="#0b0b0b" text-anchor="start" letter-spacing="0">The Standard East Village</text><rect x="1095.2" y="385.0" width="36.8" height="34.0" fill="#0b0b0b" stroke="#0b0b0b" stroke-width="2"/><text x="1148.0" y="411.0" font-size="22" font-weight="400" fill="#8a8a8a" text-anchor="start" letter-spacing="0">$369 to $415</text><text x="800.0" y="463.0" font-size="24" font-weight="700" fill="#0b0b0b" text-anchor="start" letter-spacing="0">The Ludlow Hotel</text><rect x="1012.0" y="477.0" width="112.0" height="34.0" fill="#0b0b0b" stroke="#0b0b0b" stroke-width="2"/><text x="1140.0" y="503.0" font-size="22" font-weight="400" fill="#8a8a8a" text-anchor="start" letter-spacing="0">$265 to $405</text><text x="800.0" y="555.0" font-size="24" font-weight="700" fill="#0b0b0b" text-anchor="start" letter-spacing="0">Moxy NYC</text><rect x="951.2" y="569.0" width="88.8" height="34.0" fill="#0b0b0b" stroke="#0b0b0b" stroke-width="2"/><text x="1056.0" y="595.0" font-size="22" font-weight="400" fill="#8a8a8a" text-anchor="start" letter-spacing="0">$189 to $300</text><text x="800.0" y="647.0" font-size="24" font-weight="700" fill="#0b0b0b" text-anchor="start" letter-spacing="0">East Village Hotel</text><rect x="993.6" y="661.0" width="10.0" height="34.0" fill="#0b0b0b" stroke="#0b0b0b" stroke-width="2"/><text x="1009.6" y="687.0" font-size="22" font-weight="400" fill="#8a8a8a" text-anchor="start" letter-spacing="0">$242</text><text x="800.0" y="739.0" font-size="24" font-weight="700" fill="#0b0b0b" text-anchor="start" letter-spacing="0">Existing hotel on the site</text><rect x="800.0" y="753.0" width="120.0" height="34.0" fill="#E8FF3A" stroke="#0b0b0b" stroke-width="2"/><text x="936.0" y="779.0" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start" letter-spacing="0">from $150</text><text x="800.0" y="915.0" font-size="30" font-weight="700" fill="#0b0b0b" text-anchor="start" letter-spacing="0">The site sells rooms at under half</text><text x="800.0" y="953.0" font-size="30" font-weight="700" fill="#0b0b0b" text-anchor="start" letter-spacing="0">the neighborhood rate.</text></svg>